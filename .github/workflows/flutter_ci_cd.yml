name: AgriSync CI/CD Automated Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint_and_test:
    name: Code Analysis & Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment Cleanliness (flutter doctor)
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis (CPMK 3 & 6)
        run: flutter analyze

      - name: Execute Automated Unit & State Tests (CPMK 3 & 4)
        run: flutter test --coverage

  build_android:
    name: Build Android Release Artifacts (AAB & APK)
    needs: lint_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject Environment Template
        run: cp .env.example .env

      - name: Build Signed/Release Android App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agrisync-release-binaries
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
